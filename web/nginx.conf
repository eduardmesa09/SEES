server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # El API se publica bajo el mismo origen que la interfaz.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Aplicación de una sola página: las rutas las resuelve Angular.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
